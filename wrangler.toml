# skyphusion-monitor -- external security-posture + uptime monitor.
# A standalone Cloudflare Worker (cron) that probes the PUBLIC surfaces from CFs
# global edge (a true outside-the-fleet vantage; separate failure domain from the
# Hetzner fleet + internal Gatus (inside view). Replaces the
# retired HEL1 nofx monitor idea -- $0, no box, no cross-zone networking.
#
# account_id is read from CLOUDFLARE_ACCOUNT_ID (never hardcoded).
# Secret: NTFY_TOKEN (least-privilege ntfy publish token) -> `wrangler secret put NTFY_TOKEN`.
# Secret: HC_DEADMAN_PING_URL -- the HC.io delivery dead-man check PING url (#278) ->
#   `wrangler secret put HC_DEADMAN_PING_URL`. The email() handler GETs it on receipt at the
#   dead-man Email Routing address. Per-function: the ping url ONLY, never the HC.io mgmt key.
# Secret: HC_CRON_PING_URL -- the HC.io SCHEDULED-run dead-man check PING url (monitor#3) ->
#   `wrangler secret put HC_CRON_PING_URL`. scheduled() GETs it after each completed cron run;
#   if the cron stops firing, HC.io pages that the MONITOR is down. Per-function: ping url ONLY.
# Secret: CF_CERT_READ_TOKEN -- READ-scoped CF API token (Zone Read + SSL and Certificates Read
#   ONLY) for the TLS cert-expiry probe (monitor#3 part 2) -> `wrangler secret put
#   CF_CERT_READ_TOKEN`. Daily KV-gated sweep of active zones' certificate_packs; ntfy-warns
#   inside 14d of expires_on. Per-function token; unset -> probe no-ops.
# Secret: CF_WORKERS_READ_TOKEN -- READ-scoped CF API token carrying Account > Workers Scripts >
#   Read ONLY, for the workers.dev coverage sweep (fc#1194 / fc#1180 F2) -> `wrangler secret put
#   CF_WORKERS_READ_TOKEN`. NEVER the deploy token and never the shared crew token (that one has
#   full data-plane WRITE reach). Unset -> the coverage verdict is UNKNOWN, which FAILS the
#   posture check rather than no-opping: an absent credential must not read as "nothing exposed".
# Secret: CF_ACCOUNT_ID -- the account the coverage sweep enumerates -> `wrangler secret put
#   CF_ACCOUNT_ID`. A SECRET, not a var: this repo is PUBLIC and account_id is never hardcoded
#   (wrangler reads CLOUDFLARE_ACCOUNT_ID at DEPLOY time, which does not reach the runtime).
name = "skyphusion-monitor"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# No public route needed -- cron-triggered. The fetch handler (/health, /run) is
# only reachable if a route is added; kept off the public internet by default.
workers_dev = false
preview_urls = false

# Custom domain so internal monitoring can poll the health endpoint. /health is
# counts-only (no check names) -> safe to expose; / and gated /run also live here.
routes = [
  { pattern = "monitor.skyphusion.org", custom_domain = true }
]

# Last-run state for the /health dead-man's-switch (cron writes ts+counts; /health
# returns 503 if the last run is stale >12m or had failures -> Gatus goes RED).
[[kv_namespaces]]
binding = "MONITOR_STATE"
id = "5390096a4f8b46b280a437b26a777b38"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
NTFY_URL = "https://ntfy.skyphusion.org"
MONITOR_TOPIC = "skyphusion-uptime"
# RUN_KEY gates the manual /run fetch endpoint (set to a non-empty secret-ish value to enable).
RUN_KEY = ""
# monitor#42 tunables -- every knob is a var (src/config.ts supplies the same
# defaults when unset/invalid, so removing one can never break a run). The probe
# INVENTORY itself is config/monitors.json (CI-validated, bundled at build).
FETCH_TIMEOUT_MS = "12000"
RETRY_DELAY_MS = "1500"
HEALTH_STALE_MIN = "12"
CERT_WARN_DAYS = "14"
CERT_CHECK_INTERVAL_HOURS = "20"
# workers.dev coverage sweep cadence (fc#1194). The verdict is projected into EVERY 5-minute
# run, so /health stays RED between sweeps; this only bounds how often the CF API is polled.
WORKERSDEV_SWEEP_INTERVAL_MIN = "60"
DEADMAN_FROM = "noreply@skyphusion.org"
