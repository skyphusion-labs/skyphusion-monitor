name: ci

# PR + push gate: typecheck (tsc --noEmit). Public repo -> GitHub-hosted ubuntu-latest.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-skyphusion-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: wrangler.toml parses
        run: python3 -c "import tomllib; tomllib.load(open('wrangler.toml','rb'))"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
